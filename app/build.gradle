plugins { id 'com.android.application' }
android {
    namespace 'com.hackproff.dnspro'
    compileSdk 34
    defaultConfig {
        applicationId 'com.hackproff.dnspro'
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            storeFile file('dnspro.jks')
            storePassword 'dnspro123'
            keyAlias 'dnspro'
            keyPassword 'dnspro123'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint { abortOnError false; checkReleaseBuilds false }
}
